name: Deploy overview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install deps
        run: npm ci || npm install
      - name: Build themes from the latest finalized draft
        run: |
          # Detect from the palette source the build actually imports
          # (tools/build-final.mjs imports ./palettes/draft-<N>.mjs), NOT the
          # discovery/ playground — the two share the draft-N number by
          # convention, but this is the tree the build depends on.
          N=$(ls tools/palettes/draft-*.mjs | sed -E 's#.*draft-([0-9]+)\.mjs#\1#' | sort -n | tail -1)
          echo "Latest finalized draft: draft-$N (tools/palettes/draft-$N.mjs)"
          node tools/build-final.mjs "$N" --write
      - name: Assemble _site with clean URLs (/ = overview, /preview/ = preview)
        run: node a11y-way-pages/tools/assemble-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
